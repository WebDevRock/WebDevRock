# /etc/nginx/sites-available/webdevrock.uk
# Static Astro site deployed by deploy.ps1 to /var/www/webdevrock.uk.
# The "managed by Certbot" lines were written by certbot: keep them when editing, and test and reload with:
# sudo nginx -t && sudo systemctl reload nginx
# This file mirrors the droplet's copy, which is edited by hand: change both together.
# 25 Oct 2026: www redirects to the bare domain, the Markdown copies point search engines at their HTML pages,
# and llms-full.txt is kept out of search results. Applied on the droplet the same day.

server {
    server_name webdevrock.uk;

    root /var/www/webdevrock.uk;
    index index.html;

    # llms.txt, the .md copies and the RSS feed contain non-ASCII characters
    charset utf-8;

    # Branded "not found" page (src/pages/404.astro); the address bar keeps the missing URL
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Astro builds each route as /route/index.html; anything else is a real 404.
    # No /index.html fallback: it would serve the homepage, with a 200, for every missing address.
    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed build assets: the file name changes whenever the content does, so cache for a year.
    # Files outside /_astro/ (og-default.png, favicon.svg, /pagefind/) keep their names between deploys,
    # so they get nginx's default caching and browsers pick up new versions.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Markdown copies of each page for AI tools, e.g. /snippets/sql-bulk-update-join.md. The canonical Link
    # header tells search engines the HTML page (/snippets/sql-bulk-update-join/) is the original, so the copy
    # isn't indexed as a duplicate. AI tools still read it as before.
    location ~ ^(?<page>/.+)\.md$ {
        types { }
        default_type text/markdown;
        charset_types text/markdown;
        add_header Link "<https://webdevrock.uk$page/>; rel=\"canonical\"";
        try_files $uri =404;
    }

    # The whole site in one file for AI tools. It has no single HTML equivalent to point a canonical at, so it is
    # kept out of search results instead (noindex doesn't stop anything reading it).
    location = /llms-full.txt {
        add_header X-Robots-Tag "noindex";
        try_files $uri =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/webdevrock.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/webdevrock.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# https://www -> https:// bare domain, so there is one address per page. The certificate covers both names.
# No ipv6only=on here: it may only be set once per address and port, and the block above sets it.
server {
    server_name www.webdevrock.uk;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/webdevrock.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webdevrock.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://webdevrock.uk$request_uri;
}

# HTTP -> HTTPS. www goes straight to the bare domain rather than via https://www.
server {
    if ($host = www.webdevrock.uk) {
        return 301 https://webdevrock.uk$request_uri;
    } # managed by Certbot

    if ($host = webdevrock.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name webdevrock.uk www.webdevrock.uk;
    return 404; # managed by Certbot
}
