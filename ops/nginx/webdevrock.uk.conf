# /etc/nginx/sites-available/webdevrock.uk
# Static Astro site deployed by deploy.ps1 to /var/www/webdevrock.uk

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name webdevrock.uk;

    return 301 https://webdevrock.uk$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webdevrock.uk;

    root /var/www/webdevrock.uk;
    index index.html;

    # Certificates from certbot: check these paths with `sudo certbot certificates`
    ssl_certificate /etc/letsencrypt/live/webdevrock.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webdevrock.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # llms.txt and the .md copies contain non-ASCII characters
    charset utf-8;

    # Branded "not found" page built from src/pages/404.astro (the URL in the address bar stays the same)
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Astro builds each route as /route/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # Markdown copies of each page for AI tools, e.g. /snippets/sql-bulk-update-join.md
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        charset_types text/markdown;
        try_files $uri =404;
    }

    # Hashed build assets: the file name changes whenever the content does
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
